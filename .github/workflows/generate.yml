name: 記事自動生成

on:
  schedule:
    # GitHub cron は遅延しうるので、15分間隔の追い上げを基本にする。
    # scripts 側で settings.generation_time（JST）以降かつ成功数未達なら実行する。
    # UI の実行時刻変更でこの YAML の書き換えは不要。
    - cron: "0,15,30,45 * * * *"
  workflow_dispatch: {} # 手動トリガー可（時刻判定をスキップして即実行）

jobs:
  generate:
    runs-on: ubuntu-latest
    # 1日複数本だと1本あたり数分かかるため余裕を持たせる
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: 記事生成バッチ実行
        run: npm run generate
        env:
          # schedule のときだけ 1。workflow_dispatch（手動）は 0 で即実行。
          GENERATE_SCHEDULED: ${{ github.event_name == 'schedule' && '1' || '0' }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          NEXT_PUBLIC_SITE_URL: ${{ secrets.NEXT_PUBLIC_SITE_URL }}
